name: user_pagination_app
description: "A Flutter application demonstrating Clean Architecture, API pagination, offline caching, and robust error handling."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # State Management
  flutter_bloc: ^8.1.3
  equatable: ^2.0.5

  # Navigation & URL Launching
  go_router: ^13.2.0
  url_launcher: ^6.2.4

  # Service Locator & DI
  get_it: ^7.6.7

  # Networking
  http: ^1.2.0
  connectivity_plus: ^6.0.0

  # Functional programming utilities
  dartz: ^0.10.1

  # Local Caching
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  # UI / Assets / Visual Helpers
  cached_network_image: ^3.3.1
  shimmer: ^3.0.0
  google_fonts: ^6.1.0
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  bloc_test: ^9.1.7
  mocktail: ^1.0.3
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/images/app_logo.png"
  min_sdk_android: 21
  web:
    generate: true
    image_path: "assets/images/app_logo.png"
    background_color: "#1E88E5"
    theme_color: "#1E88E5"
  windows:
    generate: true
    image_path: "assets/images/app_logo.png"
    icon_size: 48
  macos:
    generate: true
    image_path: "assets/images/app_logo.png"

flutter:
  uses-material-design: true
  assets:
    - assets/images/
